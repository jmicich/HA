play_music:
  alias: Play Music
  description: Play a specific item that was already found via search_music. Always
    call search_music first and choose one of its candidates - do not call this with
    a uri you were not given by search_music, and never invent or guess one. Returns
    the name of what actually started playing.
  icon: mdi:music
  mode: restart
  sequence:
  - alias: Resolve target player
    variables:
      p: '{{ player | default('''', true) | string }}'
      matched: '{%- set candidates = states.media_player | selectattr(''attributes.mass_player_type'',
        ''defined'') | rejectattr(''entity_id'', ''in'', label_entities(''no_music''))
        | list -%}

        {%- set direct = (candidates | selectattr(''entity_id'', ''eq'', p) | map(attribute=''entity_id'')
        | list) + (candidates | selectattr(''name'', ''eq'', p) | map(attribute=''entity_id'')
        | list) -%}

        {%- set ns = namespace(found=(direct | first | default('''', true))) -%}

        {%- if ns.found == '''' and p != '''' -%}

        {%- for c in candidates -%}

        {%- set an = area_name(c.entity_id) -%}

        {%- if ns.found == '''' and an and (an | lower) in (p | lower) -%}

        {%- set ns.found = c.entity_id -%}

        {%- endif -%}

        {%- endfor -%}

        {%- endif -%}

        {{ ns.found }}'
      target_player: '{{ matched if matched != '''' else ''media_player.living_room''
        }}'
      radio: '{{ (radio_mode | default(false, true)) and not (repeat | default(false,
        true)) }}'
  - alias: Fail loudly if a named speaker did not resolve
    if:
    - condition: template
      value_template: '{{ p != '''' and matched == '''' }}'
    then:
    - variables:
        err:
          error: No speaker is named '{{ p }}'. Nothing was played. Each entry
            below gives a speaker's exact name AND the room it is in. Retry with
            the name whose room matches the room the user asked for - do not pick
            by which name looks most like '{{ p }}'. If no listed room matches,
            say that room has no speaker instead of substituting another.
          speakers: '{%- set ns = namespace(items=[]) -%}

            {%- for c in states.media_player | selectattr(''attributes.mass_player_type'',
            ''defined'') | rejectattr(''entity_id'', ''in'', label_entities(''no_music'')) -%}

            {%- set ns.items = ns.items + [{''name'': c.name, ''room'': area_name(c.entity_id)
            | default(''no room assigned'', true)}] -%}

            {%- endfor -%}

            {{ ns.items }}'
    - stop: Unknown speaker
      response_variable: err
  - action: music_assistant.play_media
    target:
      entity_id: '{{ target_player }}'
    data:
      media_id: '{{ uri }}'
      media_type: '{{ kind }}'
      enqueue: replace
      radio_mode: '{{ radio }}'
  - alias: Set repeat if requested
    if:
    - condition: template
      value_template: '{{ repeat | default(false, true) }}'
    then:
    - action: media_player.repeat_set
      target:
        entity_id: '{{ target_player }}'
      data:
        repeat: one
  - variables:
      result:
        played: '{{ name }}'
        kind: '{{ kind }}'
        repeat: '{{ repeat | default(false, true) }}'
        radio: '{{ radio }}'
        player: '{{ state_attr(target_player, ''friendly_name'') | default(target_player,
          true) }}'
  - event: music_played
    event_data:
      played: '{{ result.played }}'
      kind: '{{ result.kind }}'
      artist: '{{ artist | default('''', true) }}'
  - stop: Playback started
    response_variable: result
  fields:
    uri:
      name: URI
      description: The exact uri of the chosen candidate, copied verbatim from search_music's
        results.
      required: true
      selector:
        text:
    kind:
      name: Kind
      description: The chosen candidate's kind, from search_music's results.
      required: true
      selector:
        select:
          options:
          - track
          - album
          - playlist
          - radio
    name:
      name: Name
      description: The chosen candidate's name, from search_music's results.
      required: true
      selector:
        text:
    artist:
      name: Artist
      description: The chosen candidate's artist, from search_music's results, if
        it had one.
      required: false
      selector:
        text:
    player:
      name: Player
      description: Which speaker to play on. When the user named a ROOM, pass the
        room's name ("living room", "dining room") - that is the most reliable
        form and resolves to the speaker in that room. When they named a specific
        speaker, pass the name you see for it. Omit entirely when they named
        neither; that uses the Living Room Speaker.
      required: false
      selector:
        entity:
          domain: media_player
          integration: music_assistant
    repeat:
      name: Repeat
      description: True if the request asked to play this on repeat/on loop. Omit
        or false otherwise.
      required: false
      selector:
        boolean: {}
    radio_mode:
      name: Radio mode
      description: True when the request is open-ended listening rather than one
        specific thing - "play some music", "put something on", "play something like
        Fleetwood Mac", "some jazz", "music for dinner". Music Assistant then keeps
        the queue filled with similar tracks after your chosen candidate finishes,
        so a single call covers the whole session and nothing further is needed from
        you. Omit or false when the user named a specific song, album or playlist
        and would not expect it to roll on into other music. Ignored when repeat is
        true.
      required: false
      selector:
        boolean: {}
search_music:
  alias: Search Music
  icon: mdi:music-note-plus
  description: 'Search the music library and streaming services for something to play.
    Always call this BEFORE play_music - it returns real candidate matches for you
    to choose from and plays nothing itself. Search results are ordered only by each
    provider''s own internal ranking, not by correctness: a title can match several
    unrelated real songs. Pick the candidate that actually matches what was asked,
    using your own knowledge (the well-known original, the artist implied or named,
    a specific version if the user asked for one) - do not just take the first result.
    A candidate with a "note" field closely matches something recently played in this
    house: prefer it when the request is vague or garbled, but not over a clearly
    better match.'
  mode: restart
  fields:
    query:
      name: Query
      description: 'What to search for: an artist, album, song, playlist, or radio
        station. If the user did not say what to play, pass a genre or mood such as
        chill or rock.'
      required: true
      selector:
        text:
    media_type:
      name: Media Type
      description: 'What kind of thing was asked for. Use ''track'' for a named song,
        ''album'' for a named album, ''artist'' for a band or performer, ''playlist''
        for a named playlist, ''radio'' only for an actual radio station such as BBC
        Radio 6. A genre or mood such as EDM, rock or chill is NOT radio: leave this
        field unset for those.'
      required: false
      selector:
        select:
          options:
          - track
          - album
          - artist
          - playlist
          - radio
    artist:
      name: Artist
      description: The performer's name, only if the request names one for a song
        or album (e.g. 'play Yesterday by The Beatles' -> 'The Beatles'). Leave unset
        for playlist, radio, bare artist, or genre/mood requests, or when no performer
        was named.
      required: false
      selector:
        text:
  sequence:
  - alias: Search
    action: music_assistant.search
    data:
      config_entry_id: 01KZTNVHAVM54QQGJJ22W5DP43
      name: '{{ query }}'
      media_type:
      - artist
      - album
      - playlist
      - track
      - radio
    response_variable: found
  - alias: Build candidate list
    variables:
      allowed_kinds: '{%- if media_type is defined and media_type in [''track'',''album'',''playlist'',''radio'']
        -%}

        {{ [media_type] }}

        {%- elif media_type is defined and media_type == ''artist'' -%}

        {{ [''playlist'',''album''] }}

        {%- else -%}

        {{ [''playlist'',''album'',''track''] }}

        {%- endif -%}'
      artist_l: '{{ artist | default('''', true) | lower }}'
      recall_match: '{%- macro cdice(a, b) -%}

        {%- set al = a | lower | replace('' '', '''') -%}

        {%- set bl = b | lower | replace('' '', '''') -%}

        {%- set nsb = namespace(remaining=(bl | list)) -%}

        {%- set nsc = namespace(n=0) -%}

        {%- for ch in (al | list) -%}

        {%- if ch in nsb.remaining -%}

        {%- set nsc.n = nsc.n + 1 -%}

        {%- set rem = namespace(new=[], done=false) -%}

        {%- for x in nsb.remaining -%}

        {%- if x == ch and not rem.done -%}

        {%- set rem.done = true -%}

        {%- else -%}

        {%- set rem.new = rem.new + [x] -%}

        {%- endif -%}

        {%- endfor -%}

        {%- set nsb.remaining = rem.new -%}

        {%- endif -%}

        {%- endfor -%}

        {%- set denom = (al|length)+(bl|length) -%}

        {{- ((2*nsc.n)/denom) if denom > 0 else 0 -}}

        {%- endmacro -%}

        {%- set recall_options = state_attr(''input_select.music_recall'', ''options'')
        | default([], true) -%}

        {%- set nsm = namespace(best='''', score=0) -%}

        {%- for r in recall_options -%}

        {%- set s = cdice(query, r) | float -%}

        {%- if s > nsm.score -%}

        {%- set nsm.score = s -%}

        {%- set nsm.best = r -%}

        {%- endif -%}

        {%- endfor -%}

        {{ nsm.best if nsm.score >= 0.5 else '''' }}'
      candidates: '{%- set ns = namespace(items=[]) -%}

        {%- for kind, bucket in [(''track'', found.tracks), (''album'', found.albums),
        (''playlist'', found.playlists), (''radio'', found.radio)] -%}

        {%- if kind in allowed_kinds -%}

        {%- set filtered = bucket | rejectattr(''uri'', ''search'', ''^bbc_sounds'')
        | list -%}

        {%- set ms = namespace(matched=[]) -%}

        {%- if artist_l != '''' and kind in [''track'',''album''] -%}

        {%- for it in filtered -%}

        {%- for a in (it.artists | default([], true)) -%}

        {%- if artist_l in (a.name | default('''', true) | lower) -%}

        {%- set ms.matched = ms.matched + [it.uri] -%}

        {%- endif -%}

        {%- endfor -%}

        {%- endfor -%}

        {%- endif -%}

        {%- set nsp = namespace(pool=[]) -%}

        {%- if ms.matched | length > 0 -%}

        {%- for it in filtered -%}

        {%- if it.uri in ms.matched -%}

        {%- set nsp.pool = nsp.pool + [it] -%}

        {%- endif -%}

        {%- endfor -%}

        {%- else -%}

        {%- set nsp.pool = filtered -%}

        {%- endif -%}

        {%- set pool = nsp.pool -%}

        {%- set rc = namespace(recall=[], other=[]) -%}

        {%- if recall_match != '''' -%}

        {%- for it in pool -%}

        {%- if (it.name | lower | trim) == (recall_match | lower | trim) -%}

        {%- set rc.recall = rc.recall + [it] -%}

        {%- else -%}

        {%- set rc.other = rc.other + [it] -%}

        {%- endif -%}

        {%- endfor -%}

        {%- else -%}

        {%- set rc.other = pool -%}

        {%- endif -%}

        {%- set other_ranked = (rc.other | selectattr(''uri'', ''search'', ''^library'')
        | list) + (rc.other | selectattr(''uri'', ''search'', ''^spotify'') | list)
        + (rc.other | selectattr(''uri'', ''search'', ''^apple_music'') | list) +
        rc.other -%}

        {%- set ranked = rc.recall + other_ranked -%}

        {%- set ns2 = namespace(seen=[]) -%}

        {%- for it in ranked -%}

        {%- if it.uri not in ns2.seen -%}

        {%- set ns2.seen = ns2.seen + [it.uri] -%}

        {%- if (ns.items | selectattr(''kind'',''eq'',kind) | list | length) < 4 -%}

        {%- set ns.items = ns.items + [{''uri'': it.uri, ''kind'': kind, ''name'':
        it.name, ''artist'': ((it.artists | default([], true) | map(attribute=''name'')
        | join('', '')) if it.artists is defined else ''''), ''note'': (''matches
        something recently played'' if it in rc.recall else '''')}] -%}

        {%- endif -%}

        {%- endif -%}

        {%- endfor -%}

        {%- endif -%}

        {%- endfor -%}

        {%- set final = (ns.items | selectattr(''note'', ''ne'', '''') | list) + (ns.items
        | selectattr(''note'', ''eq'', '''') | list) -%}

        {{ final }}'
  - variables:
      result:
        candidates: '{{ candidates }}'
  - stop: Search complete
    response_variable: result
clarify_music_choice:
  alias: Clarify Music Choice
  icon: mdi:comment-question
  description: Use this INSTEAD of play_music when you genuinely cannot choose between
    two real search_music candidates — for example, a candidate marked with a recently-played
    note conflicts with the one you would otherwise pick by type or ranking. Speaks
    a short question out loud on the house's voice speaker and waits for a spoken
    answer, then plays whichever the user picked. This takes noticeably longer than
    a normal play (a full extra spoken exchange) — only use it when truly undecided,
    never as a routine step and never when one candidate is clearly right.
  mode: restart
  fields:
    question:
      name: Question
      description: A short spoken question naming both options plainly, e.g. "Did
        you mean the playlist called Roomers, or Rumours by Fleetwood Mac?"
      required: true
      selector:
        text:
    option_a_uri:
      name: Option A URI
      required: true
      selector:
        text:
    option_a_kind:
      name: Option A Kind
      required: true
      selector:
        select:
          options:
          - track
          - album
          - playlist
          - radio
    option_a_name:
      name: Option A Name
      required: true
      selector:
        text:
    option_a_artist:
      name: Option A Artist
      required: false
      selector:
        text:
    option_b_uri:
      name: Option B URI
      required: true
      selector:
        text:
    option_b_kind:
      name: Option B Kind
      required: true
      selector:
        select:
          options:
          - track
          - album
          - playlist
          - radio
    option_b_name:
      name: Option B Name
      required: true
      selector:
        text:
    option_b_artist:
      name: Option B Artist
      required: false
      selector:
        text:
    player:
      name: Player
      description: Which speaker to play the chosen answer on. Omit to use the Living
        Room Speaker.
      required: false
      selector:
        entity:
          domain: media_player
          integration: music_assistant
  sequence:
  - alias: Resolve target player
    variables:
      p: '{{ player | default('''', true) | string }}'
      matched: '{%- set candidates = states.media_player | selectattr(''attributes.mass_player_type'',
        ''defined'') | rejectattr(''entity_id'', ''in'', label_entities(''no_music''))
        | list -%}

        {%- set direct = (candidates | selectattr(''entity_id'', ''eq'', p) | map(attribute=''entity_id'')
        | list) + (candidates | selectattr(''name'', ''eq'', p) | map(attribute=''entity_id'')
        | list) -%}

        {%- set ns = namespace(found=(direct | first | default('''', true))) -%}

        {%- if ns.found == '''' and p != '''' -%}

        {%- for c in candidates -%}

        {%- set an = area_name(c.entity_id) -%}

        {%- if ns.found == '''' and an and (an | lower) in (p | lower) -%}

        {%- set ns.found = c.entity_id -%}

        {%- endif -%}

        {%- endfor -%}

        {%- endif -%}

        {{ ns.found }}'
      target_player: '{{ matched if matched != '''' else ''media_player.living_room''
        }}'
  - alias: Fail loudly if a named speaker did not resolve
    if:
    - condition: template
      value_template: '{{ p != '''' and matched == '''' }}'
    then:
    - variables:
        err:
          error: No speaker is named '{{ p }}'. Nothing was played. Each entry
            below gives a speaker's exact name AND the room it is in. Retry with
            the name whose room matches the room the user asked for - do not pick
            by which name looks most like '{{ p }}'. If no listed room matches,
            say that room has no speaker instead of substituting another.
          speakers: '{%- set ns = namespace(items=[]) -%}

            {%- for c in states.media_player | selectattr(''attributes.mass_player_type'',
            ''defined'') | rejectattr(''entity_id'', ''in'', label_entities(''no_music'')) -%}

            {%- set ns.items = ns.items + [{''name'': c.name, ''room'': area_name(c.entity_id)
            | default(''no room assigned'', true)}] -%}

            {%- endfor -%}

            {{ ns.items }}'
    - stop: Unknown speaker
      response_variable: err
  - alias: Ask the question
    action: assist_satellite.ask_question
    data:
      entity_id: assist_satellite.home_assistant_voice_0a9a69_assist_satellite
      question: '{{ question }}'
      answers: '{%- set a_sentences = [option_a_name] + ([option_a_artist] if option_a_artist
        | default('''', true) != '''' else []) + [''the '' + option_a_kind] -%}

        {%- set b_sentences = [option_b_name] + ([option_b_artist] if option_b_artist
        | default('''', true) != '''' else []) + [''the '' + option_b_kind] -%}

        {{ [{''id'': ''a'', ''sentences'': a_sentences}, {''id'': ''b'', ''sentences'':
        b_sentences}] }}'
    response_variable: answer
  - choose:
    - alias: User picked option A
      conditions:
      - condition: template
        value_template: '{{ answer is defined and answer.id == ''a'' }}'
      sequence:
      - action: music_assistant.play_media
        target:
          entity_id: '{{ target_player }}'
        data:
          media_id: '{{ option_a_uri }}'
          media_type: '{{ option_a_kind }}'
          enqueue: replace
      - variables:
          result:
            played: '{{ option_a_name }}'
            kind: '{{ option_a_kind }}'
            player: '{{ state_attr(target_player, ''friendly_name'') | default(target_player,
              true) }}'
      - event: music_played
        event_data:
          played: '{{ result.played }}'
          kind: '{{ result.kind }}'
          artist: '{{ option_a_artist | default('''', true) }}'
      - stop: Playback started
        response_variable: result
    - alias: User picked option B
      conditions:
      - condition: template
        value_template: '{{ answer is defined and answer.id == ''b'' }}'
      sequence:
      - action: music_assistant.play_media
        target:
          entity_id: '{{ target_player }}'
        data:
          media_id: '{{ option_b_uri }}'
          media_type: '{{ option_b_kind }}'
          enqueue: replace
      - variables:
          result:
            played: '{{ option_b_name }}'
            kind: '{{ option_b_kind }}'
            player: '{{ state_attr(target_player, ''friendly_name'') | default(target_player,
              true) }}'
      - event: music_played
        event_data:
          played: '{{ result.played }}'
          kind: '{{ result.kind }}'
          artist: '{{ option_b_artist | default('''', true) }}'
      - stop: Playback started
        response_variable: result
    default:
    - variables:
        err:
          error: No answer was understood, or nothing was said in time. Nothing was
            played.
    - stop: No answer
      response_variable: err
set_music_repeat:
  alias: Set Music Repeat
  icon: mdi:repeat
  description: Turn repeat on or off. Call this with ONLY the mode - there is no speaker
    field and no song field, so there is nothing to ask the user about. It figures
    out the speaker itself from whatever is currently playing. Use it for 'repeat
    this song', 'play this on loop', 'stop repeating', 'turn off repeat' - anything
    that names no new content. Never ask which speaker or which song; you cannot pass
    either. For 'play X on repeat' where X is newly named content, use search_music
    then play_music with its repeat field instead - do not call this script for that
    case.
  mode: restart
  fields:
    mode:
      name: Mode
      description: '''one'' to repeat the current track on loop, ''off'' to stop repeating.'
      required: true
      selector:
        select:
          options:
          - one
          - 'off'
  sequence:
  - alias: Resolve the speaker from what is actually playing
    variables:
      playing: '{{ states.media_player | selectattr(''attributes.mass_player_type'',
        ''defined'') | selectattr(''state'', ''eq'', ''playing'') | map(attribute=''entity_id'')
        | list }}'
      target_player: '{{ playing[0] if (playing | length) == 1 else ''media_player.living_room''
        }}'
  - action: media_player.repeat_set
    target:
      entity_id: '{{ target_player }}'
    data:
      repeat: '{{ mode }}'
  - variables:
      result:
        repeat: '{{ mode }}'
        player: '{{ state_attr(target_player, ''friendly_name'') | default(target_player,
          true) }}'
        chosen_because: '{{ ''it is the speaker currently playing'' if (playing |
          length) == 1 else ''nothing was playing, so the default speaker was used''
          }}'
  - stop: Repeat mode set
    response_variable: result
ask_general_knowledge:
  alias: Ask General Knowledge
  description: Escalates a general-knowledge, current-events, sports-score, or local-happenings
    question to a more capable research agent with live web search. Call this whenever
    the request needs up-to-date, specific, or current information you do not already
    know with certainty - never try to answer these yourself, even if you think you
    know. Returns the researched answer verbatim; relay it exactly, do not add to
    or embellish it.
  icon: mdi:web-search
  mode: queued
  sequence:
  - action: conversation.process
    data:
      text: '{{ question }}'
      agent_id: conversation.anthropic_claude_sonnet_5
    response_variable: answer
  - variables:
      result:
        answer: '{{ answer.response.speech.plain.speech }}'
  - stop: Answer ready
    response_variable: result
  fields:
    question:
      name: Question
      description: The user's question, exactly as asked, in their own words. Do not
        paraphrase, shorten, or summarize it.
      required: true
      selector:
        text:
dj_queue_tracks:
  alias: DJ Queue Tracks
  description: Internal worker for DJ sessions - generates a tracklist, verifies each
    candidate actually resolves to what was asked for, and queues the survivors. Not
    exposed to Assist; called by start_dj_session and steer_dj_session.
  icon: mdi:playlist-plus
  mode: single
  fields:
    brief:
      name: Brief
      description: The station brief to generate against.
      required: true
      selector:
        text: null
    player:
      name: Player
      description: Already-resolved target speaker entity id.
      required: true
      selector:
        text: null
    enqueue_mode:
      name: Enqueue mode
      description: replace for a new session, replace_next to steer without cutting
        off the current track.
      required: false
      selector:
        select:
          options:
          - replace
          - replace_next
    count:
      name: Count
      description: How many tracks to ask for.
      required: false
      selector:
        number:
          min: 4
          max: 20
          mode: box
  sequence:
  - alias: Generate a candidate tracklist
    action: ai_task.generate_data
    data:
      task_name: dj session tracklist
      entity_id: ai_task.openai_ai_task
      instructions: >-
        Choose {{ count | default(10, true) }} real songs for background listening
        in a home, matching this brief: {{ brief }}

        The brief accumulates as the listener steers, so parts of it may conflict.
        Later instructions always win over earlier ones. If a later part replaces
        the genre or mood outright ("instead", "actually make it", "switch to"),
        drop the earlier direction completely rather than blending the two.

        Rules. Every song must genuinely exist and be by the artist you name - never
        invent a title, and never pair a real title with an artist who did not record
        it. Vary the artists: at most two songs by any one artist. Prefer the
        original studio recording over live versions, covers, remixes and karaoke.
        Do not add qualifiers like "(Instrumental)" or "(Remastered)" to a title -
        name the track as the catalogue does, or pick a different track.

        Already used in this session - do not choose any of these again:
        {{ (state_attr('input_select.dj_session_history', 'options') | default([], true)) | reject('eq', '(none)') | join('; ') }}

        Return only the structured data.
      structure:
        tracks:
          selector:
            object:
              multiple: true
              fields:
                artist:
                  selector:
                    text: null
                  required: true
                title:
                  selector:
                    text: null
                  required: true
          description: The chosen songs
          required: true
    response_variable: gen
  - alias: Resolve and verify each candidate
    repeat:
      for_each: '{{ gen.data.tracks | default([], true) }}'
      sequence:
      - action: music_assistant.search
        data:
          config_entry_id: 01KZTNVHAVM54QQGJJ22W5DP43
          name: '{{ repeat.item.title }}'
          artist: '{{ repeat.item.artist }}'
          media_type:
          - track
        response_variable: hit
      - alias: Accept only a candidate that matches the title AND the artist asked for
        variables:
          picked: >-
            {%- macro nrm(s) -%}
            {{- s | default('', true) | lower | trim | regex_replace('[^a-z0-9 ]', '') | regex_replace('\s+', ' ') | trim -}}
            {%- endmacro -%}
            {%- set want_t = nrm(repeat.item.title) -%}
            {%- set want_a = nrm(repeat.item.artist) -%}
            {%- set pool = (hit.tracks | default([], true)) | rejectattr('uri', 'search', '^bbc_sounds') | list -%}
            {%- set ranked = (pool | selectattr('uri','search','^library') | list) + (pool | selectattr('uri','search','^spotify') | list) + (pool | selectattr('uri','search','^apple_music') | list) + pool -%}
            {%- set ns = namespace(found='') -%}
            {%- for it in ranked -%}
            {%- if ns.found == '' -%}
            {%- set got_t = nrm(it.name) -%}
            {%- set got_a = nrm(it.artists | default([], true) | map(attribute='name') | join(' ')) -%}
            {%- if want_t != '' and want_a != '' and (got_t == want_t or got_t.startswith(want_t)) and want_a in got_a -%}
            {%- set ns.found = it.uri -%}
            {%- endif -%}
            {%- endif -%}
            {%- endfor -%}
            {{ ns.found }}
      - alias: Accumulate survivors and casualties separately
        variables:
          uris: '{{ (uris | default([], true)) + ([picked] if picked != '''' else []) }}'
          dropped: '{{ (dropped | default([], true)) + ([] if picked != '''' else [repeat.item.artist
            ~ '' - '' ~ repeat.item.title]) }}'
      - alias: Start playback on the first survivor rather than after the whole loop
        if:
        - condition: template
          value_template: '{{ picked != '''' and (uris | default([], true)) | length
            == 1 and (enqueue_mode | default(''replace'', true)) == ''replace'' }}'
        then:
        - action: music_assistant.play_media
          target:
            entity_id: '{{ player }}'
          data:
            media_id: '{{ [picked] }}'
            media_type: track
            enqueue: '{{ enqueue_mode | default(''replace'', true) }}'
            radio_mode: false
      - alias: Space the provider calls so a batch does not trip the rate limiter
        delay:
          milliseconds: 150
  - alias: Refuse to play anything if nothing survived verification
    if:
    - condition: template
      value_template: '{{ (uris | default([], true)) | length == 0 }}'
    then:
    - variables:
        err:
          error: Nothing from the generated tracklist could be verified against the
            music library, so nothing was played.
          generated: '{{ (gen.data.tracks | default([], true)) | length }}'
          dropped: '{{ dropped | default([], true) }}'
    - stop: Nothing verified
      response_variable: err
  - alias: Queue the batch, arming radio fill as the end-of-session backstop
    choose:
    - alias: Steering - replace the whole up-next run in one call
      conditions:
      - condition: template
        value_template: '{{ (enqueue_mode | default(''replace'', true)) == ''replace_next''
          }}'
      sequence:
      - action: music_assistant.play_media
        target:
          entity_id: '{{ player }}'
        data:
          media_id: '{{ uris }}'
          media_type: track
          enqueue: replace_next
          radio_mode: false
    - alias: New session - the first survivor is already playing, queue the rest behind it
      conditions:
      - condition: template
        value_template: '{{ (uris | default([], true)) | length > 1 }}'
      sequence:
      - action: music_assistant.play_media
        target:
          entity_id: '{{ player }}'
        data:
          media_id: '{{ uris[1:] }}'
          media_type: track
          enqueue: add
          radio_mode: true
  - alias: Remember what was used so a steer or refill does not repeat it
    action: input_select.set_options
    target:
      entity_id: input_select.dj_session_history
    data:
      options: >-
        {%- set fresh = (gen.data.tracks | default([], true)) | map(attribute='artist') | list -%}
        {%- set titles = (gen.data.tracks | default([], true)) | map(attribute='title') | list -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for i in range(titles | length) -%}
        {%- set ns.items = ns.items + [fresh[i] ~ ' - ' ~ titles[i]] -%}
        {%- endfor -%}
        {%- set prior = (state_attr('input_select.dj_session_history', 'options') | default([], true)) | reject('eq', '(none)') | list -%}
        {%- set ns2 = namespace(out=[]) -%}
        {%- for x in (ns.items + prior) -%}
        {%- if x not in ns2.out -%}
        {%- set ns2.out = ns2.out + [x] -%}
        {%- endif -%}
        {%- endfor -%}
        {{ ns2.out[:60] if ns2.out | length > 0 else ['(none)'] }}
  - variables:
      result:
        queued: '{{ (uris | default([], true)) | length }}'
        generated: '{{ (gen.data.tracks | default([], true)) | length }}'
        dropped: '{{ (dropped | default([], true)) | length }}'
        dropped_titles: '{{ dropped | default([], true) }}'
        backstop: '{{ (uris | default([], true)) | length > 1 }}'
  - stop: Batch queued
    response_variable: result
start_dj_session:
  alias: Start DJ Session
  description: Start a DJ session - open-ended, curated listening where you pick the
    music for a while. Use this when the request describes a vibe, mood, era, activity
    or constraint rather than naming one specific thing to play ("be my DJ", "put on
    something for dinner", "70s soul but nothing slow", "music for working"). Do NOT
    use it when the user named a specific song, album, artist or playlist - use Search
    Music and Play Music for those. Resolves the speaker once, up front, and keeps
    using it for the whole session.
  icon: mdi:disc-player
  mode: single
  fields:
    brief:
      name: Brief
      description: A short description of the music wanted, in your own words, capturing
        every constraint the user gave - genre, mood, era, energy, activity, and anything
        they said to avoid. Do not name a single specific song unless they did.
      required: true
      selector:
        text: null
    player:
      name: Player
      description: Which speaker to play on. When the user named a ROOM, pass the
        room's name ("living room", "dining room") - that is the most reliable
        form and resolves to the speaker in that room. When they named a specific
        speaker, pass the name you see for it. Omit entirely when they named
        neither; that uses the Living Room Speaker.
      required: false
      selector:
        entity:
          domain: media_player
          integration: music_assistant
    duration_minutes:
      name: Duration minutes
      description: How long to play for, in minutes, only if the user gave a length
        ("for an hour", "for the next 20 minutes"). Omit if they did not - the session
        then runs until they stop it.
      required: false
      selector:
        number:
          min: 5
          max: 480
          mode: box
  sequence:
  - alias: Resolve target player
    variables:
      p: '{{ player | default('''', true) | string }}'
      matched: '{%- set candidates = states.media_player | selectattr(''attributes.mass_player_type'',
        ''defined'') | rejectattr(''entity_id'', ''in'', label_entities(''no_music''))
        | list -%}

        {%- set direct = (candidates | selectattr(''entity_id'', ''eq'', p) | map(attribute=''entity_id'')
        | list) + (candidates | selectattr(''name'', ''eq'', p) | map(attribute=''entity_id'')
        | list) -%}

        {%- set ns = namespace(found=(direct | first | default('''', true))) -%}

        {%- if ns.found == '''' and p != '''' -%}

        {%- for c in candidates -%}

        {%- set an = area_name(c.entity_id) -%}

        {%- if ns.found == '''' and an and (an | lower) in (p | lower) -%}

        {%- set ns.found = c.entity_id -%}

        {%- endif -%}

        {%- endfor -%}

        {%- endif -%}

        {{ ns.found }}'
      target_player: '{{ matched if matched != '''' else ''media_player.living_room''
        }}'
  - alias: Fail loudly if a named speaker did not resolve
    if:
    - condition: template
      value_template: '{{ p != '''' and matched == '''' }}'
    then:
    - variables:
        err:
          error: No speaker is named '{{ p }}'. No session was started. Each entry
            below gives a speaker's exact name AND the room it is in. Retry with
            the name whose room matches the room the user asked for - do not pick
            by which name looks most like '{{ p }}'. If no listed room matches,
            say that room has no speaker instead of substituting another.
          speakers: '{%- set ns = namespace(items=[]) -%}

            {%- for c in states.media_player | selectattr(''attributes.mass_player_type'',
            ''defined'') | rejectattr(''entity_id'', ''in'', label_entities(''no_music'')) -%}

            {%- set ns.items = ns.items + [{''name'': c.name, ''room'': area_name(c.entity_id)
            | default(''no room assigned'', true)}] -%}

            {%- endfor -%}

            {{ ns.items }}'
    - stop: Unknown speaker
      response_variable: err
  - alias: Record the session, resolving the speaker once so it cannot drift mid-session
    action: input_text.set_value
    target:
      entity_id: input_text.dj_session_player
    data:
      value: '{{ target_player }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.dj_session_brief
    data:
      value: '{{ brief[:255] }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.dj_session_active
  - alias: Start from a clean history so a new session may reuse earlier favourites
    action: input_select.set_options
    target:
      entity_id: input_select.dj_session_history
    data:
      options:
      - (none)
  - alias: Arm the stop timer only when a length was actually given
    if:
    - condition: template
      value_template: '{{ duration_minutes | default(0, true) | int > 0 }}'
    then:
    - action: timer.start
      target:
        entity_id: timer.dj_session
      data:
        duration: '{{ (duration_minutes | int) * 60 }}'
    else:
    - action: timer.cancel
      target:
        entity_id: timer.dj_session
  - alias: Generate, verify and queue the first batch
    action: script.dj_queue_tracks
    data:
      brief: '{{ brief }}'
      player: '{{ target_player }}'
      enqueue_mode: replace
      count: 12
    response_variable: q
  - variables:
      result:
        started: '{{ q.queued | default(0, true) > 0 }}'
        brief: '{{ brief }}'
        queued: '{{ q.queued | default(0, true) }}'
        dropped: '{{ q.dropped | default(0, true) }}'
        minutes: '{{ duration_minutes | default(0, true) | int }}'
        player: '{{ state_attr(target_player, ''friendly_name'') | default(target_player,
          true) }}'
        error: '{{ q.error | default('''', true) }}'
  - stop: Session started
    response_variable: result
steer_dj_session:
  alias: Steer DJ Session
  description: Adjust the music a DJ session is playing, without starting a new one.
    Use this when a session is already running and the user asks for a change of direction
    rather than a specific song ("less mellow", "more upbeat", "nothing with vocals",
    "no more Motown"). The track playing now finishes; everything queued after it is
    replaced. Only works while a session is active - if none is, say so instead of
    starting one.
  icon: mdi:tune-vertical
  mode: single
  fields:
    adjustment:
      name: Adjustment
      description: What the user wants changed, in their own words ("less mellow",
        "no more Motown").
      required: true
      selector:
        text: null
  sequence:
  - alias: Refuse if no session is running
    if:
    - condition: template
      value_template: '{{ not is_state(''input_boolean.dj_session_active'', ''on'') }}'
    then:
    - variables:
        err:
          error: No DJ session is running, so there is nothing to steer. Nothing was
            changed.
    - stop: No session
      response_variable: err
  - alias: Amend the brief rather than replacing it, so earlier constraints survive
    variables:
      new_brief: '{{ ((states(''input_text.dj_session_brief'') ~ ''; '' ~ adjustment)
        | trim)[:255] }}'
      session_player: '{{ states(''input_text.dj_session_player'') }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.dj_session_brief
    data:
      value: '{{ new_brief }}'
  - alias: Replace what is queued after the current track
    action: script.dj_queue_tracks
    data:
      brief: '{{ new_brief }}'
      player: '{{ session_player }}'
      enqueue_mode: replace_next
      count: 12
    response_variable: q
  - variables:
      result:
        steered: '{{ q.queued | default(0, true) > 0 }}'
        brief: '{{ new_brief }}'
        queued: '{{ q.queued | default(0, true) }}'
        dropped: '{{ q.dropped | default(0, true) }}'
        player: '{{ state_attr(session_player, ''friendly_name'') | default(session_player,
          true) }}'
        error: '{{ q.error | default('''', true) }}'
  - stop: Session steered
    response_variable: result
stop_dj_session:
  alias: Stop DJ Session
  description: End a running DJ session and pause the music. Use this for "stop the
    DJ", "that's enough music", "stop DJing". It pauses playback and clears the session,
    so nothing more is queued. It takes no fields - never ask which speaker.
  icon: mdi:stop-circle-outline
  mode: single
  sequence:
  - variables:
      was_active: '{{ is_state(''input_boolean.dj_session_active'', ''on'') }}'
      session_player: '{{ states(''input_text.dj_session_player'') }}'
  - alias: Pause the speaker the session actually claimed, not a guessed one
    if:
    - condition: template
      value_template: '{{ was_active and session_player | regex_search(''^media_player\.'')
        }}'
    then:
    - action: media_player.media_pause
      target:
        entity_id: '{{ session_player }}'
  - action: timer.cancel
    target:
      entity_id: timer.dj_session
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.dj_session_active
  - action: input_text.set_value
    target:
      entity_id: input_text.dj_session_brief
    data:
      value: ''
  - variables:
      result:
        stopped: '{{ was_active }}'
        player: '{{ state_attr(session_player, ''friendly_name'') | default('''', true)
          if was_active else '''' }}'
        note: '{{ ''No DJ session was running.'' if not was_active else '''' }}'
  - stop: Session stopped
    response_variable: result
