- id: '1787077211852'
  alias: Music recall — log resolved plays
  description: Listens for the music_played event fired by script.play_music and maintains
    a newest-first, deduped, 40-item list of resolved plays in input_select.music_recall.
    That list is injected into the conversation agent prompt so garbled song requests
    can be matched against what has actually played in this house. See music-recall-memory.md.
  triggers:
  - trigger: event
    event_type: music_played
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.played | default('''') != '''' }}'
  actions:
  - action: input_select.set_options
    target:
      entity_id: input_select.music_recall
    data:
      options: '{{ ([trigger.event.data.played] + state_attr(''input_select.music_recall'',''options'')
        | reject(''eq'', trigger.event.data.played) | reject(''eq'',''(none)'') |
        list)[:40] }}'
  mode: queued
  max: 10
- id: '1787341200001'
  alias: DJ session — stop when the duration runs out
  description: Ends a DJ session started with a duration ("play music for an hour").
    timer.finished fires only on natural expiry, not on timer.cancel, so stopping a
    session by voice does not re-enter stop_dj_session through this. The active-session
    condition is a second guard on the same thing. See voice-and-music.md.
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.dj_session
  conditions:
  - condition: state
    entity_id: input_boolean.dj_session_active
    state: 'on'
  actions:
  - action: script.stop_dj_session
  mode: single
